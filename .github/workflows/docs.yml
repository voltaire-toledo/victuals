name: Publish Quartz documentation

on:
  push:
    branches: [main, codex/feature/quartz-docs]
    paths:
      - "docs/**"
      - "quartz.config.yaml"
      - "vendor/quartz"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Victuals and Quartz
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendor/quartz/package-lock.json

      - name: Install Quartz dependencies
        working-directory: vendor/quartz
        run: npm ci

      - name: Apply Victuals Quartz configuration
        run: cp quartz.config.yaml vendor/quartz/quartz.config.yaml

      - name: Build documentation
        working-directory: vendor/quartz
        run: node quartz/bootstrap-cli.mjs build -d ../../docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: vendor/quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
