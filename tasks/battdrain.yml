version: '3'

tasks:
  config:
    desc: "Install the battdrain battery diagnostics command"
    cmds:
      - task: "config:{{OS}}"

  config:windows:
    cmds:
      - echo "battdrain is only supported on Linux."

  config:darwin:
    cmds:
      - echo "battdrain is only supported on Linux."

  config:linux:
    cmds:
      - mkdir -p "{{.HOME}}/.local/bin"
      - chmod 0755 "{{.ROOT_DIR}}/os/linux/scripts/battdrain"
      - ln -sfn "{{.ROOT_DIR}}/os/linux/scripts/battdrain" "{{.HOME}}/.local/bin/battdrain"
      - echo "Installed battdrain at {{.HOME}}/.local/bin/battdrain"
